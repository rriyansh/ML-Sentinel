{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "ml-sentinel.fullname" . }}
  labels: {{- include "ml-sentinel.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "ml-sentinel.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowIngressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              name: {{ . }}
        {{- end }}
      ports:
        - { port: 8000, protocol: TCP }
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
{{- end }}
