{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ml-sentinel.fullname" . }}-secrets
  labels: {{- include "ml-sentinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey required" .Values.secrets.secretKey | quote }}
  ENCRYPTION_KEY: {{ required "secrets.encryptionKey required" .Values.secrets.encryptionKey | quote }}
  API_KEYS: {{ required "secrets.apiKeys required" .Values.secrets.apiKeys | quote }}
{{- end }}
