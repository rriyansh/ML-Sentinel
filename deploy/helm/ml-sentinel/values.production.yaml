replicaCount: 3

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  hosts:
    - host: ml-sentinel.your-domain.com
      paths: [{ path: "/", pathType: Prefix }]
  tls:
    - secretName: ml-sentinel-tls
      hosts: [ml-sentinel.your-domain.com]

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits:   { cpu: 2000m, memory: 2Gi }

podDisruptionBudget:
  enabled: true
  minAvailable: 2

secrets:
  create: false  # Use External Secrets Operator + Vault in production

env:
  ENVIRONMENT: production
  OIDC_ENABLED: "true"
  SECRETS_BACKEND: vault
