[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-sentinel"
version = "3.0.0"
description = "Enterprise MLOps platform with drift detection, explainability, fairness, and zero-trust serving"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ML-Sentinel Team" }]

dependencies = [
    "feast[mlflow,postgres,redis]>=0.42.0",
    "evidently>=0.6.0",
    "mlflow>=2.16.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "shap>=0.46.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "cryptography>=43.0.0",
    "authlib>=1.3.0",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-requests>=0.48b0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "redis>=5.1.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
    "hvac>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "apache-airflow>=2.10.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.112.0",
    "locust>=2.32.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.0",
    "cyclonedx-bom>=5.1.0",
    "import-linter>=2.1.0",
    "types-PyYAML>=6.0.12",
    "types-requests>=2.32.0",
]

[project.scripts]
ml-sentinel-train = "mlflow.train:main"
ml-sentinel-model-card = "scripts.generate_model_card:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ml_sentinel*", "serving*", "monitoring*", "mlflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --cov=src --cov=serving --cov=monitoring --cov-fail-under=75 --cov-report=term-missing"
markers = [
    "integration: integration tests",
    "load: load tests (skipped by default)",
    "contract: contract tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["feast_repo/data", "mlruns", "airflow/logs", "deploy", "infra"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "S", "RUF", "ASYNC", "PT"]
ignore = ["S101", "S104", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
exclude = "(deploy|infra|tests)/"

[tool.bandit]
exclude_dirs = ["tests", "deploy", "infra"]
skips = ["B101", "B601"]
