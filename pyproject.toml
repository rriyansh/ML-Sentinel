[project]
name = "ml-sentinel"
version = "1.0.0"
description = "Automated MLOps pipeline with drift detection and retraining"
requires-python = ">=3.10"
dependencies = [
    "feast[mlflow]>=0.40.0",
    "evidently>=0.6.0",
    "mlflow>=2.10.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "apache-airflow>=2.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
]
