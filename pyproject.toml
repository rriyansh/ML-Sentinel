[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-sentinel"
version = "2.0.0"
description = "Production-grade automated MLOps pipeline with drift detection, retraining, and champion/challenger promotion"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ML-Sentinel Team" }]

dependencies = [
    "feast[mlflow,postgres,redis]>=0.42.0",
    "evidently>=0.6.0",
    "mlflow>=2.16.0",
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "pyarrow>=17.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "redis>=5.1.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "apache-airflow>=2.10.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.0",
    "types-PyYAML>=6.0.12",
]

[project.scripts]
ml-sentinel-train = "mlflow.train:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ml_sentinel*", "serving*", "monitoring*", "mlflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra --strict-markers --cov=src --cov=serving --cov=monitoring --cov-report=term-missing --cov-fail-under=70"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["feast_repo/data", "mlruns", "airflow/logs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "S", "RUF"]
ignore = ["S101", "S104"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
