name: Release
on:
  push:
    tags: ["v*.*.*"]
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install cyclonedx-bom && cyclonedx-py requirements -i requirements.txt -o sbom.json
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sbom.json
            CHANGELOG.md
          generate_release_notes: true
