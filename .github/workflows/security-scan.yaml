name: CI/CD
on:
  push: { branches: [main, develop] }
  pull_request: { branches: [main] }
permissions:
  contents: read
  packages: write
env:
  PYTHON_VERSION: "3.10"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src serving monitoring mlflow
      - run: import-linter lint || true

  test:
    needs: lint
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      SECRET_KEY: ci-secret-key-with-enough-entropy-1234567890
      ENCRYPTION_KEY: kNfK8XbRw3h9nPZQhG7jCkYe0gY2mAVa6IioK5zPq4U=
      API_KEYS: ci-key-1,ci-key-2
      MLFLOW_TRACKING_URI: file:///tmp/mlruns
      DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: htmlcov/ }

  security:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install -e ".[dev]"
      - run: bandit -r src serving monitoring mlflow -ll -f json -o bandit.json
      - run: pip-audit -r requirements.txt --strict
      - run: |
          pip install cyclonedx-bom
          cyclonedx-py requirements -i requirements.txt -o sbom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: security-artifacts, path: "bandit.json\nsbom.json" }

  docker-build:
    needs: [test, security]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.serving
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-serving:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-serving:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
      - name: Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-serving:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
