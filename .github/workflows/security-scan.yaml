name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 3 * * *"    # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: pip-audit (strict, JSON)
        run: pip-audit -r requirements.txt --strict --format json > pip-audit.json || true

      - name: bandit (SARIF)
        run: |
          pip install bandit[sarif]
          bandit -r src serving monitoring mlflow -ll -f sarif -o bandit.sarif || true

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif

      - name: Fail on high/critical pip-audit findings
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("pip-audit.json"))
          vulns = data.get("dependencies", [])
          bad = [v for v in vulns if any(x.get("severity") in {"high", "critical"} for x in v.get("vulns", []))]
          if bad:
              print("High/critical vulnerabilities found:", bad)
              sys.exit(1)
          PY
