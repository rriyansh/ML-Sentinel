# CI/CD pipeline for ML-Sentinel
name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r ml-sentinel/requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          cd ml-sentinel && pytest tests/unit tests/integration -v

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build serving image
        run: |
          docker build -t ml-sentinel-serving -f ml-sentinel/docker/Dockerfile.serving ml-sentinel
      - name: Build train image
        run: |
          docker build -t ml-sentinel-train -f ml-sentinel/docker/Dockerfile.train ml-sentinel
