[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-sentinel"
version = "1.0.0"
description = "MLOps pipeline with Feast, MLflow, Evidently, Airflow, and FastAPI"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.2",
    "pyarrow>=15.0.2",
    "scikit-learn>=1.4.0",
    "mlflow>=2.11.0",
    "feast>=0.40.0",
    "evidently>=0.4.28",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.0",
    "boto3>=1.34.0",
]

[project.scripts]
ml-sentinel-train = "mlflow.train:train"
ml-sentinel-drift = "monitoring.drift_check:check_drift"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ml_sentinel*"]
