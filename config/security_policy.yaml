password_policy:
  min_length: 12
  require_uppercase: true
  require_lowercase: true
  require_digit: true
  require_special: true

jwt:
  allowed_algorithms: [HS256, RS256]
  require_iss: true
  require_aud: true
  clock_skew_seconds: 30

rbac:
  roles:
    viewer:
      scopes: [read]
    analyst:
      scopes: [read, predict]
    scientist:
      scopes: [read, predict, explain, train]
    admin:
      scopes: [read, predict, explain, train, promote, admin]

pii:
  masked_fields: [email, phone, ssn]
  hashed_fields: [driver_id]
  encryption_algorithm: fernet

rate_limit:
  per_minute: 60
  burst: 10
  key: ip

cors:
  max_age_seconds: 600
  allow_credentials: true

headers:
  hsts_max_age_seconds: 63072000
  x_frame_options: DENY
  x_content_type_options: nosniff
