drift:
  threshold: 0.4
  statistical_test: psi
  p_value_threshold: 0.05
  features_to_monitor:
    - conv_rate
    - acc_rate
    - avg_daily_trips
  min_sample_size: 100
  report:
    output_dir: monitoring/reports
    formats: [html, json]
  alert:
    enabled: true
    cooldown_minutes: 60
  explanation:
    shap_background_samples: 100
    top_k_features: 3
