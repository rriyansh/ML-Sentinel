version: "3.9"

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-ml_sentinel_production}
  MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-MLSentinelModel}
  DATABASE_URL: postgresql+psycopg2://mlsentinel:mlsentinel@postgres:5432/mlsentinel
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-please-1234567890}
  API_KEYS: ${API_KEYS:-dev-key-abc123}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  FEAST_REPO_PATH: /app/feast_repo

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlsentinel
      POSTGRES_PASSWORD: mlsentinel
      POSTGRES_DB: mlsentinel
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlsentinel -d mlsentinel"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [backend]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary boto3 &&
             mlflow server
             --host 0.0.0.0
             --port 5000
             --backend-store-uri postgresql+psycopg2://mlsentinel:mlsentinel@postgres:5432/mlsentinel
             --default-artifact-root /mlartifacts
             --serve-artifacts"
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "5000:5000"
    networks: [backend]

  serving:
    build:
      context: .
      dockerfile: docker/Dockerfile.serving
    restart: unless-stopped
    depends_on:
      mlflow:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *common-env
      SERVING_HOST: 0.0.0.0
      SERVING_PORT: 8000
      DRIFT_REPORT_DIR: /app/monitoring/reports
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  airflow-init:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
      bash -c "airflow db init &&
               airflow users create
                 --username ${AIRFLOW_ADMIN_USER:-admin}
                 --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
                 --firstname Admin --lastname User
                 --role Admin --email admin@example.com"
    networks: [backend]

  airflow-webserver:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [backend]

  airflow-scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.airflow
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: scheduler
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  mlartifacts:

networks:
  backend:
    driver: bridge
