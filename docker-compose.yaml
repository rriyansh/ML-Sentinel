version: "3.9"

x-common-env: &common-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-ml_sentinel_production}
  MLFLOW_MODEL_NAME: ${MLFLOW_MODEL_NAME:-MLSentinelModel}
  DATABASE_URL: postgresql+psycopg2://mlsentinel:mlsentinel@postgres:5432/mlsentinel
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me-please-1234567890}
  API_KEYS: ${API_KEYS:-dev-key-abc123}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-kNfK8XbRw3h9nPZQhG7jCkYe0gY2mAVa6IioK5zPq4U=}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
  FEAST_REPO_PATH: /app/feast_repo
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: ml-sentinel-serving
  PROMETHEUS_MULTIPROC_DIR: /tmp/prom

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlsentinel
      POSTGRES_PASSWORD: mlsentinel
      POSTGRES_DB: mlsentinel
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlsentinel"]
      interval: 10s
      retries: 10
    networks: [backend]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 10
    networks: [backend]

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.16.2
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary boto3 &&
             mlflow server --host 0.0.0.0 --port 5000
               --backend-store-uri postgresql+psycopg2://mlsentinel:mlsentinel@postgres:5432/mlsentinel
               --default-artifact-root /mlartifacts --serve-artifacts"
    volumes: [mlartifacts:/mlartifacts]
    ports: ["5000:5000"]
    networks: [backend]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    networks: [backend]

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert_rules.yaml:/etc/prometheus/alert_rules.yaml:ro
      - promdata:/prometheus
    ports: ["9090:9090"]
    networks: [backend]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["3000:3000"]
    networks: [backend]

  serving:
    build:
      context: .
      dockerfile: docker/Dockerfile.serving
    restart: unless-stopped
    depends_on:
      mlflow: {condition: service_started}
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      <<: *common-env
    ports: ["8000:8000"]
    read_only: true
    tmpfs: [/tmp, /tmp/prom]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [backend]

  airflow-init:
    build: {context: ., dockerfile: docker/Dockerfile.airflow}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: >
      bash -c "airflow db init && airflow users create
        --username ${AIRFLOW_ADMIN_USER:-admin}
        --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
        --firstname Admin --lastname User --role Admin --email admin@example.com"
    networks: [backend]

  airflow-webserver:
    build: {context: ., dockerfile: docker/Dockerfile.airflow}
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    command: webserver
    ports: ["8080:8080"]
    networks: [backend]

  airflow-scheduler:
    build: {context: ., dockerfile: docker/Dockerfile.airflow}
    restart: unless-stopped
    depends_on:
      airflow-init: {condition: service_completed_successfully}
    environment:
      <<: *common-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
    command: scheduler
    networks: [backend]

volumes:
  pgdata:
  redisdata:
  mlartifacts:
  promdata:
  grafanadata:

networks:
  backend: {driver: bridge}
