project: ml_sentinel
registry: data/registry.db
provider: local
online_store:
  type: sqlite
  path: data/online_store.db

# Native MLflow integration — every feature retrieval inside an active
# MLflow run is auto-logged with full lineage (which features, which
# entity DataFrame, and the digest of the returned values).
mlflow:
  enabled: true
  tracking_uri: ${MLFLOW_TRACKING_URI:http://127.0.0.1:5000}
  auto_log: true
  auto_log_entity_df: true
